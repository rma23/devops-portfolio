name: Deploy EKS

on:
  push:
    branches:
      - main

env:
  AWS_REGION: ap-northeast-1
  ECR_REPOSITORY: devops-portfolio-app
  CLUSTER_NAME: portfolio-eks

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: arn:aws:iam::<ACCOUNT_ID>:role/devops-portfolio-github-actions-role
        aws-region: ${{ env.AWS_REGION }}

    - name: Login ECR
      uses: aws-actions/amazon-ecr-login@v2

    - name: Build Docker Image
      run: |
        docker build \
          -t $ECR_REPOSITORY:${{ github.sha }} \
          ./app

    - name: Push Image
      run: |
        docker tag \
        $ECR_REPOSITORY:${{ github.sha }} \
        ${{ secrets.ECR_URL }}/$ECR_REPOSITORY:${{ github.sha }}

        docker push \
        ${{ secrets.ECR_URL }}/$ECR_REPOSITORY:${{ github.sha }}

    - name: Update kubeconfig
      run: |
        aws eks update-kubeconfig \
        --region $AWS_REGION \
        --name $CLUSTER_NAME

    - name: Deploy Kubernetes
      run: |
        kubectl set image deployment/demo-app \
        app=${{ secrets.ECR_URL }}/$ECR_REPOSITORY:${{ github.sha }} \
        -n portfolio

